[project]
name = "ux-ui-designer-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.21",
  "rich>=14",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.15",
  "mypy>=1.19",
  "pytest>=9",
  "types-pyyaml>=6",
]

[project.scripts]
ux-ui-designer-agent = "ux_ui_designer_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ux_ui_designer_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
